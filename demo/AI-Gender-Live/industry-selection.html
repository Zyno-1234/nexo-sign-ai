<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXO Sign AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="selection-container">

        <h1>Select Industry</h1>

        <div class="industry-grid">

            <button class="industry-card" data-industry="hospital">
                🏥
                <span>Hospital</span>
            </button>

            <button class="industry-card" data-industry="hotel">
                🏨
                <span>Hotel</span>
            </button>

            <button class="industry-card" data-industry="retail">
                🛍️
                <span>Retail</span>
            </button>

            <button class="industry-card" data-industry="salon">
                💇
                <span>Salon</span>
            </button>

        </div>

    </div>

    <script src="app-selection.js"></script>

</body>

</html>
